# Entorno local completo: app + Postgres. Uso: cp .env.example .env && docker compose up --build
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nodosur
      POSTGRES_PASSWORD: nodosur
      POSTGRES_DB: nodosur
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nodosur"]
      interval: 5s
      retries: 10
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nodosur:nodosur@db:5432/nodosur
      ENABLE_SCHEDULER: "true"
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
volumes:
  pgdata:
