{% from "_icons.html" import logo %}
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Acceso · NodoSur</title>
  <link rel="icon" href="/static/img/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/static/vendor/fonts/montserrat-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/tokens.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="login-body">
  <main class="login-card">
    <a class="brand" href="/">{{ logo() }}<span>nodo<b>sur</b></span></a>
    <h1>Panel del equipo</h1>
    <p class="muted">Motor de búsqueda de empleo TI, agente 24/7 y leads de la web.</p>
    {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/admin/login">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="username" required>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn btn-primary" type="submit">Entrar</button>
    </form>
  </main>
</body>
</html>
