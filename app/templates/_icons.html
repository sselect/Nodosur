{% macro icon(name, size=24, cls="") -%}
<svg class="icon {{ cls }}" width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == "spark" -%}
<path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/><circle cx="12" cy="12" r="3"/>
{%- elif name == "lifebuoy" -%}
<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>
{%- elif name == "cloud" -%}
<path d="M7 18a4.5 4.5 0 0 1-.6-8.96A6 6 0 0 1 18 8.5a4.75 4.75 0 0 1-.5 9.5H7z"/>
{%- elif name == "layout" -%}
<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11"/>
{%- elif name == "code" -%}
<path d="M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14"/>
{%- elif name == "boxes" -%}
<path d="M3 8l9-5 9 5-9 5-9-5z"/><path d="M3 8v8l9 5 9-5V8M12 13v8"/>
{%- elif name == "arrow" -%}
<path d="M5 12h14M13 6l6 6-6 6"/>
{%- elif name == "download" -%}
<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>
{%- elif name == "check" -%}
<path d="M5 12.5l4.5 4.5L19 7"/>
{%- elif name == "chat" -%}
<path d="M4 5h16v11H9l-5 4V5z"/><path d="M8 10h8M8 13h5"/>
{%- elif name == "menu" -%}
<path d="M4 7h16M4 12h16M4 17h16"/>
{%- elif name == "close" -%}
<path d="M6 6l12 12M18 6L6 18"/>
{%- elif name == "shield" -%}
<path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/>
{%- elif name == "bolt" -%}
<path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/>
{%- elif name == "mail" -%}
<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>
{%- elif name == "pin" -%}
<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>
{%- elif name == "send" -%}
<path d="M4 12l16-8-6 16-2.5-6.5L4 12z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(cls="") -%}
<svg class="logo-mark {{ cls }}" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" focusable="false">
  <circle cx="6" cy="22" r="3" fill="currentColor"/>
  <circle cx="22" cy="6" r="3" fill="currentColor"/>
  <circle cx="22" cy="22" r="3" fill="var(--logo-accent, #c8f25c)"/>
  <path d="M6 22L22 6M22 6v16M6 22h16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
{%- endmacro %}
