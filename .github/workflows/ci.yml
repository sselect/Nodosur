name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint)
        run: ruff check .
      - name: Ruff (formato)
        run: ruff format --check .
      - name: Pytest + cobertura
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  postgres:
    name: Tests contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: nodosur
          POSTGRES_PASSWORD: nodosur
          POSTGRES_DB: nodosur
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nodosur" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pytest (Postgres)
        env:
          TEST_DATABASE_URL: postgresql://nodosur:nodosur@localhost:5432/nodosur
        run: pytest

  docker:
    name: Build imagen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t nodosur:ci .
      - name: Smoke test del contenedor
        run: |
          docker run -d --name app -p 8000:8000 -e ENV=dev -e DATABASE_URL=sqlite:////tmp/ci.db nodosur:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/healthz && break; sleep 1; done
          curl -fsS localhost:8000/ | grep -q "NodoSur"
          curl -fsS -o /dev/null localhost:8000/descargas/catalogo-servicios-nodosur.xlsx
          docker logs app
