# Blueprint de Render (infraestructura como código). Plan Free para arrancar.
# Ojo: la base Postgres Free vence a los 30 días; súbela a un plan pago antes de esa fecha.
services:
  - type: web
    name: nodosur
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: ENV
        value: prod
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase: { name: nodosur-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: AGENT_TOKEN
        generateValue: true  # el mismo valor va al secret AGENT_TOKEN de GitHub
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true  # cópiala desde Render → Environment para entrar a /admin
      - key: PUBLIC_BASE_URL
        sync: false
      - { key: SMTP_HOST, value: smtp.gmail.com }
      - { key: SMTP_PORT, value: "587" }
      - { key: SMTP_USER, sync: false }
      - { key: SMTP_PASSWORD, sync: false }
      - { key: NOTIFY_TO, sync: false }
      - { key: CONTACT_TO, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
databases:
  - name: nodosur-db
    plan: free
    region: oregon
